# ============================================================
# TARA - Model Configurations
# ============================================================

# --- Primary LLM ---
llm:
  primary:
    name: "llama3.2:3b"
    provider: "ollama"
    parameters:
      temperature: 0.1
      top_p: 0.9
      max_tokens: 1024
      repeat_penalty: 1.1
    context_window: 8192
    estimated_vram_gb: 2.0

  alternative:
    name: "phi3.5:3.8b"
    provider: "ollama"
    parameters:
      temperature: 0.1
      top_p: 0.9
      max_tokens: 1024
    context_window: 4096
    estimated_vram_gb: 2.5

# --- Embedding Model ---
embedding:
  name: "BAAI/bge-small-en-v1.5"
  dimension: 384
  max_tokens: 512
  estimated_vram_mb: 130
  normalize: true

# --- Reranker ---
reranker:
  name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_length: 512
  estimated_vram_mb: 80

# --- VRAM Budget ---
vram_budget:
  total_gb: 6.0
  llm_gb: 2.0
  embedding_gb: 0.15
  reranker_gb: 0.1
  kv_cache_gb: 1.5
  overhead_gb: 0.5
  remaining_gb: 1.75
